<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>영감님 성공하기</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1730; --bg2:#16213f; --card:#1d2a4d; --card2:#243358; --line:#33456f;
  --text:#eef2ff; --muted:#93a3c8; --gold:#f5c451; --gold2:#e0a526;
  --good:#4ade80; --bad:#f87171; --blue:#60a5fa; --purple:#c084fc;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at top,#1d2b55 0%,var(--bg) 60%) fixed;background-color:var(--bg);color:var(--text);
  font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:12px 16px 24px}
#app.wide{max-width:1180px}
/* 게임 화면: 모바일은 1단(카드가 위쪽), 넓은 화면은 2단으로 한눈에 */
.game{display:grid;grid-template-columns:minmax(0,1fr);gap:0 18px;grid-template-areas:"top" "react" "choose" "info" "log"}
.g-top{grid-area:top}.g-react{grid-area:react}.g-choose{grid-area:choose;margin-bottom:10px}.g-info{grid-area:info}.g-log{grid-area:log}
@media (min-width:900px){
  .game{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"top top" "react choose" "info choose" "info log";align-items:start}
  .modal.wide{max-width:900px}
  .modal.wide .m-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
  .modal.wide .m-cols .m-body{margin-bottom:0}
  .modal.wide .report{grid-template-columns:repeat(4,1fr)}
}
@media (max-height:760px) and (min-width:900px){ .card{padding:9px 12px} .card .ic{font-size:26px} .g-log .log{max-height:110px} }
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
input{font-family:inherit}
.hidden{display:none!important}
.center{text-align:center}
.muted{color:var(--muted)}

/* ---------- 공통 ---------- */
.logo-badge{font-weight:900;letter-spacing:6px;font-size:13px;color:var(--gold);border:1.5px solid var(--gold);padding:4px 12px;border-radius:4px}
.btn{display:block;width:100%;padding:14px;border-radius:12px;font-size:16px;font-weight:700;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2b1d00;box-shadow:0 4px 0 #8a6210}
.btn-dark{background:var(--card2);border:1px solid var(--line)}
.btn-sm{font-size:13px;padding:10px}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.h3{font-weight:900;font-size:15px;margin:4px 2px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.h3 small{font-weight:500;color:var(--muted);font-size:12px}
.text-input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font-size:16px;text-align:center}

/* ---------- 타이틀 ---------- */
.title-screen{min-height:calc(100vh - 36px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
.title{font-family:'Black Han Sans',sans-serif;font-size:52px;line-height:1.1;
  background:linear-gradient(180deg,#fff3c4,var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #6b4a0a)}
.subtitle{color:var(--muted);font-size:15px}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.menu{width:100%;max-width:300px;display:flex;flex-direction:column;gap:10px}

/* ---------- 인트로 / 생성 ---------- */
.intro{min-height:calc(100vh - 36px);display:flex;flex-direction:column;justify-content:center;gap:20px}
.intro-text{font-size:16px;line-height:1.9;white-space:pre-line;min-height:280px}
.intro-text b{color:var(--gold)}
.step-tag{font-size:12px;color:var(--gold);font-weight:700;text-align:center;margin-bottom:4px}
.step-title{font-size:22px;font-weight:900;text-align:center;margin-bottom:14px}
.face-preview{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin-bottom:12px}
.face-preview .cap{font-size:11px;color:var(--muted);text-align:center;margin-top:2px}
.opt-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.opt-row:last-child{border:none}
.opt-row .nm{font-size:13px;color:var(--muted);width:60px}
.opt-row .val{flex:1;text-align:center;font-weight:700;font-size:13px}
.arrow{width:34px;height:30px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-size:13px}
.ab-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.ab{font-size:12px}
.ab .lab{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:3px}
.ab .lab b{color:var(--text);font-size:13px}
.track{height:7px;background:var(--bg2);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .4s}
.ab-desc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.total-pill{display:inline-block;background:var(--card2);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;margin:8px 0}
.rolling .lab b{animation:flash .1s linear infinite}
@keyframes flash{50%{opacity:.3}}
.biz-pick{display:flex;flex-direction:column;gap:10px}
.biz-card{text-align:left;background:linear-gradient(180deg,var(--card2),var(--card));border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.biz-card.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(245,196,81,.25)}
.biz-card .ic{font-size:34px}
.biz-card .tt{font-weight:900;font-size:16px}
.biz-card .ds{font-size:12px;color:var(--muted);line-height:1.6;margin-top:3px}
.biz-card .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--bg2)}
.tag.p{color:var(--good)} .tag.n{color:var(--bad)}

/* ---------- 게임 화면 ---------- */
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top .who{flex:1;min-width:0}
.top .nm{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .co{font-size:12px;color:var(--muted)}
.date-pill{background:var(--gold);color:#2b1d00;font-weight:900;border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.avatar{border-radius:50%;flex-shrink:0;display:block}
.money-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.money{background:var(--bg2);border-radius:10px;padding:8px 4px;text-align:center}
.money .k{font-size:11px;color:var(--muted);white-space:nowrap}
.money .v{font-weight:900;font-size:15px;margin-top:2px;white-space:nowrap}
.v.pos{color:var(--good)} .v.neg{color:var(--bad)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.bar .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px}
.bar .lab b{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.chip.on{border-color:var(--gold);color:var(--gold)}
.sub-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;font-size:12px;color:var(--muted);margin-top:10px}
.sub-row b{color:var(--text)}

.react{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.rx{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 2px 6px;text-align:center;position:relative}
.rx .face{font-size:20px;line-height:1}
.rx .k{font-size:11px;color:var(--muted);margin-top:3px}
.rx .v{font-weight:900;font-size:14px}
.rx .d{position:absolute;top:3px;right:4px;font-size:10px;font-weight:700}
.rx .d.p{color:var(--good)} .rx .d.n{color:var(--bad)}
.rx .track{height:4px;margin:4px 6px 0}
.rx.pulse{animation:pulse .6s}
@keyframes pulse{40%{transform:scale(1.08);border-color:var(--gold)}}

.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;padding:8px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--muted)}
.tab.on{background:var(--card2);border-color:var(--gold);color:var(--gold)}

.npc{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--line);width:100%;text-align:left;background:none}
.npc:last-child{border:none}
.npc .info{flex:1;min-width:0}
.npc .n1{font-weight:700;font-size:14px}
.npc .n2{font-size:11px;color:var(--muted)}
.npc .loy{width:84px;text-align:right;font-size:11px;color:var(--muted)}
.npc .loy b{font-size:13px}
.npc .chk{font-size:10px;color:var(--purple)}
.grp{font-size:11px;color:var(--gold);font-weight:700;margin:6px 0 2px}

.cards{display:flex;flex-direction:column;gap:8px}
.card{display:flex;gap:12px;align-items:center;text-align:left;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:14px;padding:12px;transition:transform .1s,border-color .15s;width:100%}
.card:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px)}
.card:disabled{opacity:.45;cursor:not-allowed}
.card .ic{font-size:30px;width:44px;text-align:center;flex-shrink:0}
.card .body{flex:1;min-width:0}
.card .cat{font-size:11px;font-weight:700;color:var(--blue)}
.card .cat .abt{color:var(--purple);font-weight:500;margin-left:4px}
.card .tt{font-weight:900;font-size:15px;margin:1px 0 3px}
.card .ds{font-size:12px;color:var(--muted);line-height:1.5}
.card .cost{font-size:12px;font-weight:700;color:var(--gold);flex-shrink:0;text-align:right;white-space:nowrap}
.card .cost small{display:block;font-weight:500;margin-top:2px}
.card .cost .ch{color:var(--purple)} .card .cost .bd{color:#7dd3fc} .card .cost .no{color:var(--bad)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}

.log{font-size:12px;color:var(--muted);line-height:1.7;max-height:150px;overflow:auto}
.log div{border-bottom:1px dashed var(--line);padding:3px 0}
.log div:first-child{color:var(--text)}
.log .t{color:var(--gold);font-weight:700;margin-right:6px}

/* ---------- 모달 ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,9,22,.78);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow:auto;background:var(--bg2);border:1.5px solid var(--gold);border-radius:18px;padding:20px;animation:pop .25s cubic-bezier(.2,1.4,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.modal .m-ic{font-size:48px;text-align:center;line-height:1.1}
.modal .m-ic svg{display:inline-block}
.modal .m-tag{text-align:center;font-size:12px;color:var(--gold);font-weight:700;margin-top:4px}
.modal h2{text-align:center;font-size:20px;font-weight:900;margin:4px 0 10px}
.m-body{font-size:14px;line-height:1.8;color:#d6defa;margin-bottom:14px;white-space:pre-line}
.m-body b{color:var(--gold)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt .ol{font-weight:700}
.opt .os{font-size:12px;color:var(--muted);margin-top:2px}
.sec{font-size:12px;font-weight:700;color:var(--gold);margin:10px 0 6px}
.fx{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.fx span{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--card)}
.fx .p{color:var(--good)} .fx .n{color:var(--bad)}
.fx.ab span{border:1px solid rgba(192,132,252,.4)}
.rlines{display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.rline{font-size:12.5px;background:var(--card);border-radius:10px;padding:7px 10px;line-height:1.5}
.rline .dv{font-weight:900;margin-right:4px}
.rline .dv.p{color:var(--good)} .rline .dv.n{color:var(--bad)}
.quote{background:var(--card);border-left:3px solid var(--gold);padding:9px 12px;border-radius:0 10px 10px 0;font-size:13px;line-height:1.7;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.quote.bad{border-color:var(--bad)}
.quote .qn{font-size:11px;color:var(--muted)}
.report{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 14px}
.chart{display:flex;align-items:flex-end;gap:2px;height:110px;padding:8px 4px 0;background:var(--card);border-radius:10px;margin-bottom:6px}
.chart .cb{flex:1;background:linear-gradient(180deg,var(--gold),var(--gold2));border-radius:3px 3px 0 0;min-height:2px}
.chart .cb.last{background:linear-gradient(180deg,#fff,var(--gold))}
.chart-x{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:12px}
.grade{font-family:'Black Han Sans',sans-serif;font-size:36px;text-align:center;color:var(--gold);margin:4px 0}
.score-big{font-family:'Black Han Sans',sans-serif;font-size:30px;color:var(--text)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:#2b1d00;font-weight:700;padding:10px 18px;border-radius:99px;z-index:60;animation:fade .2s;max-width:90vw;text-align:center}

/* ---------- 랭킹 ---------- */
.rank-row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--line)}
.rank-row .no{width:28px;text-align:center;font-family:'Black Han Sans',sans-serif;font-size:18px;color:var(--muted)}
.rank-row:nth-child(1) .no{color:#ffd54a} .rank-row:nth-child(2) .no{color:#d7dde8} .rank-row:nth-child(3) .no{color:#e0a36b}
.rank-row .info{flex:1;min-width:0}
.rank-row .n1{font-weight:700}
.rank-row .n2{font-size:11px;color:var(--muted)}
.rank-row .sc{text-align:right;font-weight:900;color:var(--gold);white-space:nowrap}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:5px;margin-bottom:6px}
.rank-row{cursor:pointer}.rank-row:hover{background:rgba(255,255,255,.04)}
.rank-row.me{background:rgba(245,196,81,.08);border-radius:8px}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   영감님 성공하기 — 파트론 회사 키우기
   단위: 억원 · 1턴 = 1분기 · 김종구 회장 타임라인 — 54세(2003, 파트론 창업)에 시작, 80세 또는 은퇴 시 종료
   ========================================================= */
const START_YEAR = 2003, START_AGE = 54, MAX_AGE = 80, MEMORY_END = 2026, HEIR_AGE = 65;
const SAVE_KEY = 'younggam_save_v2', LOCAL_RANK_KEY = 'younggam_rank_local';
const SERVER = new URLSearchParams(location.search).get('server') || 'https://tetris-arena-4spd.onrender.com';
const RANK_API_KEY = 'younggam-2026';

const $ = s => document.querySelector(s);
const app = $('#app');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let S = null;

function fmt(n) {
  const neg = n <= -0.05; n = Math.abs(n);
  let s;
  if (n >= 10000) { const jo = Math.floor(n / 10000), eok = Math.round(n % 10000); s = jo + '조' + (eok ? ' ' + eok.toLocaleString() + '억' : ''); }
  else if (n < 10) s = n.toFixed(1) + '억';
  else s = Math.round(n).toLocaleString() + '억';
  return (neg ? '-' : '') + s;
}

/* =========================================================
   얼굴 일러스트 (SVG 생성기) — 나이에 따라 흰머리·주름·탈모
   ========================================================= */
const SKINS = ['#f8dcc0', '#f0c7a2', '#e2ae86', '#c98f66', '#9f6c4c'];
const HAIRC = ['#1b1818', '#3b2a20', '#6b4a2e', '#a3733c', '#2c2f45', '#7a2e2e'];
const FACE_OPTS = [ // [key, 이름, 옵션이름들]
  ['s', '피부', ['밝은', '보통', '살구', '구릿빛', '진한']],
  ['h', '헤어', ['짧은 머리', '가르마', '덮은 머리', '스포츠', '올백', '단발']],
  ['c', '머리색', ['흑발', '짙은 갈색', '갈색', '밝은 갈색', '청흑', '적갈색']],
  ['e', '눈', ['또렷', '웃는 눈', '큰 눈', '졸린 눈']],
  ['b', '눈썹', ['일자', '진한', '처진']],
  ['m', '입', ['미소', '활짝', '무표정', '오!']],
  ['g', '안경', ['없음', '동그란', '뿔테']],
  ['d', '수염', ['없음', '콧수염', '턱수염']]];
const randomFace = () => Object.fromEntries(FACE_OPTS.map(([k, , arr]) => [k, k === 'g' || k === 'd' ? (chance(0.6) ? 0 : ri(1, arr.length - 1)) : ri(0, arr.length - 1)]));
function mix(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const x = p(a), y = p(b);
  return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
let faceUid = 0;
function faceSVG(f, age = START_AGE, size = 64, o = {}) {
  const skin = SKINS[f.s] || SKINS[1];
  const gray = clamp((age - 42) / 28, 0, 1);
  const hair = mix(HAIRC[f.c] || HAIRC[0], '#d9d9d9', gray);
  const line = '#3a2a22', suit = o.suit || '#1f2a44', tie = o.tie || '#c9a227', bg = o.bg || '#2a3a66';
  const bald = age >= 62 && [0, 1, 4].includes(f.h);
  const hairs = [
    'M22,46 Q21,15 50,14 Q79,15 78,46 Q74,30 50,29 Q26,30 22,46Z',
    'M21,48 Q19,13 52,12 Q81,15 79,47 Q73,26 57,27 Q41,21 31,34 Q24,40 21,48Z',
    'M20,56 Q16,12 50,12 Q84,12 80,56 Q78,40 72,36 Q60,40 40,34 Q30,38 26,44 Q22,48 20,56Z',
    'M24,40 Q26,18 50,17 Q74,18 76,40 Q70,28 50,27 Q30,28 24,40Z',
    'M22,43 Q17,6 50,6 Q83,6 78,43 Q74,22 50,21 Q26,22 22,43Z',
    'M17,66 Q12,11 50,11 Q88,11 83,66 L75,66 Q77,32 52,28 Q34,30 27,40 Q24,50 25,66Z'];
  const hairPath = bald ? 'M22,52 Q20,36 28,31 L30,46Z M78,52 Q80,36 72,31 L70,46Z' : hairs[f.h] || hairs[0];
  const eyes = [

const yf = s => s.year + (s.q - 1) / 4;
function marketFactor(s) {
  const y = yf(s); let sum = 0;
  for (const k in s.biz) if (s.biz[k]) sum += BIZ[k].trend(y);

function crisis(s) {

  if (y >= 2020.25 && y < 2020.75) return 0.85;
  return 1;
}
const loanLimit = s => (20 + s.cap * 2.5) * (0.6 + s.market / 125);

function calc(s) {
  const mf = marketFactor(s) * crisis(s);
  const share = (s.sales + s.market + s.tech) / 300 * (0.8 + s.client / 250);
  // 시장 규모: 2026년까지 연 15%p씩 커지다가, 회장님도 모르는 미래(2027~)엔 성장 둔화
  const y = yf(s), size = y <= MEMORY_END ? 1 + (y - START_YEAR) * 0.15 : 1 + (MEMORY_END - START_YEAR) * 0.15 + (y - MEMORY_END) * 0.05;
  const demand = 1200 * mf * size * share;
  const util = clamp(Math.min((0.3 + s.sales * 0.004 + s.market * 0.002 + s.quality * 0.002 + (s.client - 50) * 0.002) * mf, demand / s.cap), 0.15, 1);
  const rev = s.cap * util;
  const margin = 0.1 + s.tech * 0.002 + s.quality * 0.001 + s.mb + (s.partner - 50) * 0.0008 + (s.morale < 30 ? -0.04 : s.morale > 75 ? 0.01 : 0);
  const fixed = 0.6 + s.cap * 0.025;
  const op = rev * margin - fixed;
  const interest = s.debt * rate(s);
  return { util, rev, margin, op, interest, profit: op - interest };
}

    field: s => { s.quality += 8; return `${nm}가 현장 개선 아이디어 50건을 모아 왔다. 불량률이 뚝 떨어졌다.`; } }[t.area]
    || (s => { s.holder += 10; s.market += 4; return `${nm}가 언론 인터뷰에서 회장님 경영을 극찬했다. 주가가 들썩였다.`; });

}

function newState(o) {
  const s = { ceo: { name: o.name, face: o.face }, company: o.company || '파트론', mainBiz: o.mainBiz,
    year: START_YEAR, q: 1, turn: 0, age: START_AGE, health: 100,
    cash: 30, debt: 0, cap: 10, tech: 20, quality: 30, sales: 15, mb: 0, own: 100, memory: 3,
    market: 45, client: 50, partner: 50, holder: 55, morale: 60,
    ab: { ...o.ab, know: Math.min(100, o.ab.know + SAMSUNG_BONUS.know), lead: Math.min(100, o.ab.lead + SAMSUNG_BONUS.lead) }, biz: { [o.mainBiz]: true }, flags: {}, hist: [], qhist: [], log: [], hand: null,
    npcs: ['park', 'kim', 'choi', 'lee', 'jung'].map(id => makeNpc(id)), pAct: false, prevR: null };
  Object.assign(s, START_BIZ[o.mainBiz].st);
  return s;
}
function normalize(s) {
  for (const k of ['tech', 'quality', 'sales', 'health', 'market', 'client', 'partner', 'holder', 'morale']) s[k] = clamp(s[k], 0, 100);
  for (const k in s.ab) s.ab[k] = clamp(Math.round(s.ab[k] * 10) / 10, 0, 100);
  for (const n of s.npcs) n.loyal = clamp(n.loyal, 0, 100);
  s.own = clamp(s.own, 0, 100); s.mb = clamp(s.mb, -0.05, 0.14); s.cap = Math.max(3, s.cap);
}

function modal({ icon, tag, title, body, extra = '', options, wide }) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  // wide: 넓은 화면에서 본문(이야기)과 결과(변화·반응·결산)를 좌우로 나눠 스크롤 없이 보이게
  const content = wide && body && extra ? `<div class="m-cols"><div class="m-body">${body}</div><div>${extra}</div></div>`
    : `${body ? `<div class="m-body">${body}</div>` : ''}${extra}`;
  ov.innerHTML = `<div class="modal ${wide ? 'wide' : ''}">
    ${icon ? `<div class="m-ic">${icon}</div>` : ''}${tag ? `<div class="m-tag">${tag}</div>` : ''}
    <h2>${title}</h2>${content}
    <div class="opts" style="margin-top:12px"></div></div>`;
  const box = ov.querySelector('.opts');
  options.forEach(o => {
    const b = document.createElement('button');
    b.className = o.primary ? 'btn btn-gold' : o.dark ? 'btn btn-dark btn-sm' : 'opt';
    b.innerHTML = o.primary || o.dark ? o.label : `<div class="ol">${o.label}</div>${o.sub ? `<div class="os">${o.sub}</div>` : ''}`;
    if (o.disabled) b.disabled = true;
    b.onclick = () => { ov.remove(); o.onClick && o.onClick(); };
    box.appendChild(b);
  });
  document.body.appendChild(ov);
  return ov;
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1900);
}
// 변화 기록용 스냅샷 → 결과창의 "회사 변화 / 능력치 / 반응"
const CO_KEYS = [['cash', '자금', 'm'], ['debt', '부채', 'm'], ['cap', '생산능력', '%'], ['tech', '기술', ''], ['quality', '품질', ''], ['sales', '영업', ''], ['health', '체력', ''], ['own', '지분', ''], ['memory', '기억★', '']];
function snap() {
  return { co: Object.fromEntries(CO_KEYS.map(([k]) => [k, S[k]])), ab: { ...S.ab }, rx: Object.fromEntries(REACT.map(([k]) => [k, S[k]])), mb: S.mb };
}
function diffHtml(b) {
  let h = '';
  const co = [];
  for (const [k, lab, t] of CO_KEYS) {
    const d = S[k] - b.co[k];
    if (t === 'm' ? Math.abs(d) < 0.05 : t === '%' ? Math.abs(d / b.co[k]) < 0.005 : Math.round(d) === 0) continue;
    const v = t === 'm' ? (d > 0 ? '+' : '') + fmt(d) : t === '%' ? `${d > 0 ? '+' : ''}${Math.round(d / b.co[k] * 100)}%` : (d > 0 ? '+' : '') + Math.round(d);
    co.push(`<span class="${(d > 0) !== (k === 'debt') ? 'p' : 'n'}">${lab} ${v}</span>`);
  }
  if (Math.abs(S.mb - b.mb) > 0.001) co.push(`<span class="${S.mb > b.mb ? 'p' : 'n'}">이익률 ${S.mb > b.mb ? '+' : ''}${((S.mb - b.mb) * 100).toFixed(1)}%p</span>`);
  if (co.length) h += `<div class="sec">📊 회사 변화</div><div class="fx">${co.join('')}</div>`;
  const ab = ABIL.filter(([k]) => Math.round(S.ab[k] - b.ab[k]) !== 0).map(([k, n, ic]) => { const d = S.ab[k] - b.ab[k]; return `<span class="${d > 0 ? 'p' : 'n'}">${ic} ${n} ${d > 0 ? '+' : ''}${Math.round(d)}</span>`; });
  if (ab.length) h += `<div class="sec">🧠 회장님 능력치 성장</div><div class="fx ab">${ab.join('')}</div>`;
  const rl = REACT.filter(([k]) => Math.abs(S[k] - b.rx[k]) >= 2).map(([k, n, ic]) => {
    const d = S[k] - b.rx[k];
    const q = pick(REACT_Q[k][d > 0 ? 'up' : 'down']).replace('{co}', esc(S.company));
    return `<div class="rline">${ic} <b>${n}</b> <span class="dv ${d > 0 ? 'p' : 'n'}">${d > 0 ? '▲' : '▼'}${Math.abs(Math.round(d))}</span> ${q}</div>`;
  });
  if (rl.length) h += `<div class="sec">🗣️ 이해관계자 반응</div><div class="rlines">${rl.join('')}</div>`;
  return h;
}
function quoteHtml(n, text, bad) {
  return `<div class="quote ${bad ? 'bad' : ''}">${npcFace(n, 38)}<div><div class="qn">${npcT(n).role} ${n.name} · 충성 ${Math.round(n.loyal)}</div>${text}</div></div>`;
}

function drawHand() {
  const avail = CARDS.filter(c => !c.avail || c.avail(S));
  const hand = [], usedCat = new Set();
  let pool = avail.slice();
  while (hand.length < 3 && pool.length) {
    const tot = pool.reduce((a, c) => a + (c.weight || 1), 0);
    let r = Math.random() * tot, sel = pool[0];
    for (const c of pool) { r -= c.weight || 1; if (r <= 0) { sel = c; break; } }
    hand.push(sel.id); usedCat.add(sel.cat);
    pool = pool.filter(c => !usedCat.has(c.cat));
    if (!pool.length) pool = avail.filter(c => !hand.includes(c.id));
  }
  S.hand = hand;
}
function pickEvent() {
  const fixed = FIXED[`${S.year}-${S.q}`];
  if (fixed && !S.flags['ev_' + S.year + S.q] && (!fixed.avail || fixed.avail(S))) { S.flags['ev_' + S.year + S.q] = 1; return fixed; }
  if (S.turn < 2) return null;
  const angry = S.npcs.filter(n => n.loyal < 35 && n.checked <= 0).sort((a, b) => a.loyal - b.loyal)[0];
  if (angry && chance(0.3 + (35 - angry.loyal) * 0.01)) return npcEvent(angry);
  const fan = S.npcs.find(n => n.loyal >= 85);
  if (fan && chance(0.12)) return npcBonus(fan);
  if (chance(0.3)) {
    const pool = RANDOM.filter(e => !e.avail || e.avail(S));
    const tot = pool.reduce((a, e) => a + (e.w || 1), 0);
    let r = Math.random() * tot;
    for (const e of pool) { r -= e.w || 1; if (r <= 0) return e; }
  }
  return null;
}
// 체력 소모 완화 — 영감님은 평생 큰 병 없이 지낸 건강 체질. 끈기가 높을수록 덜 지치고, 70세 이후엔 조금 더 지친다.
const fatigue = s => 0.65 * (1.15 - s.ab.grit / 100 * 0.5) * (s.age >= 70 ? 1.3 : 1);

}

function npcReact(cat) {
  const out = [];
  for (const n of S.npcs) {
    const t = npcT(n);
    if (t.likes.includes(cat)) { n.loyal += 5; out.push([n, pick(t.q.like), false]); }
    else if (t.dislikes.includes(cat)) { n.loyal -= n.checked > 0 ? 2 : 5; out.push([n, pick(t.q.dis), true]); }
  }
  return out.sort(() => Math.random() - 0.5).slice(0, 2);
}

function execute(id, opt = {}) {

    else {

    softenHealth(h0);
    icon = c.icon; title = c.t + (c.chance ? (ok ? ' — 성공!' : ' — 실패') : '');
    for (const [a, v] of Object.entries(c.grow || {})) S.ab[a] += v * (c.chance && !ok ? 0.5 : 1) * (S.ab[a] > 80 ? 0.5 : 1);
    if (k >= 1.2) msg += `\n\n<b>✨ 회장님의 ${c.ab.map(abName).join('·')} 덕분에 효과가 ${Math.round((k - 1) * 100)}% 더 컸다.</b>`;
    else if (k < 0.95) msg += `\n\n💦 회장님의 ${c.ab.map(abName).join('·')}이(가) 아직 부족해 효과가 ${Math.round((1 - k) * 100)}% 줄었다.`;
    quotes = npcReact(c.cat);
  }
  normalize(S);
  addLog(`${title}: ${msg.split('\n')[0].replace(/<[^>]+>/g, '')}`);
  const rep = settle();
  const extra = diffHtml(before) +
    (quotes.length ? '<div class="sec">💬 사람들 한마디</div>' + quotes.map(([n, t, bad]) => quoteHtml(n, t, bad)).join('') : '') +
    `<div class="sec">🧾 ${rep.year}년 ${rep.q}분기 결산</div><div class="report">
      <div class="money"><div class="k">분기 매출</div><div class="v">${fmt(rep.rev)}</div></div>
      <div class="money"><div class="k">영업이익</div><div class="v ${rep.op >= 0 ? 'pos' : 'neg'}">${fmt(rep.op)}</div></div>
      <div class="money"><div class="k">가동률</div><div class="v">${Math.round(rep.util * 100)}%</div></div>
      <div class="money"><div class="k">이자 비용</div><div class="v">${fmt(rep.interest)}</div></div></div>`;
  modal({ wide: true, icon, tag: `${rep.year}년 ${rep.q}분기`, title, body: msg, extra,
    options: [{ label: '다음 분기로 ▶', primary: true, onClick: () => S.cash < 0 ? cashCrisis() : advance() }] });
}

// 분기 정산 + 자연 변화
function settle() {
  S.prevR = Object.fromEntries(REACT.map(([k]) => [k, S[k]]));
  const r = calc(S);
  S.cash += r.profit;
  const prev = S.qhist.at(-1);
  S.qhist.push({ year: S.year, q: S.q, rev: r.rev, op: r.op, profit: r.profit });
  if (r.util > 0.92) S.cap *= 1.015;
  S.tech += S.flags.lab ? 0.5 : -1;
  S.sales -= 1; S.quality -= 0.5;
  S.morale += (55 - S.morale) * 0.08;
  S.health += S.age < 70 ? 0.3 : -1; // 건강 체질: 무리만 안 하면 분기마다 조금씩 회복
  // 이해관계자 자연 변화
  const grow = prev ? r.rev / Math.max(1, prev.rev) - 1 : 0;
  S.market += (45 - S.market) * 0.05 + clamp(grow * 20, -3, 3);
  S.client += ((S.quality + S.sales) / 2 - S.client) * 0.08;
  S.partner += S.cash < 0 ? -8 : (55 - S.partner) * 0.05;
  S.holder += (50 - S.holder) * 0.05 + (r.profit > 0 ? (grow > 0 ? 2 : 0.5) : -4);
  for (const n of S.npcs) { n.loyal += (55 - n.loyal) * 0.03 + (r.profit > 0 ? 0.5 : -1); if (n.checked > 0) n.checked--; }
  if (S.own < 45 && !S.npcs.find(n => n.id === 'brown') && chance(0.15)) { addHolder(S, 'brown'); addLog('행동주의 펀드 브라운이 지분을 사 모으기 시작했다.'); }
  normalize(S);
  checkAch();
  return { ...r, year: S.year, q: S.q };
}

function advance() {
  const wasQ4 = S.q === 4, year = S.year;
  S.turn++; S.age += 0.25; S.hand = null;
  if (wasQ4) {
    const qs = S.qhist.filter(h => h.year === year);
    S.hist.push({ year, rev: qs.reduce((a, h) => a + h.rev, 0), op: qs.reduce((a, h) => a + h.op, 0) });
  }
  S.q++; if (S.q > 4) { S.q = 1; S.year++; }
  save();
  if (wasQ4) annualReport(year); else startTurn();
}

/* ---------- 금융: 대출 · 상환 (턴 소모 없음) ---------- */
function bank(fromCrisis) {
  const room = Math.max(0, loanLimit(S) - S.debt);
  const opts = [];
  const maxA = Math.floor(room * 10) / 10;
  const amts = [...new Set([Math.floor(Math.min(room, 10 + S.cap * 0.5) * 10) / 10, maxA])].filter(v => v >= 1);
  for (const a of amts) opts.push({ label: `🏦 ${fmt(a)} 대출받기`, sub: a === maxA ? '한도 최대' : '', onClick: () => {
    S.cash += a; S.debt += a; addLog(`${fmt(a)} 대출`); normalize(S); save();
    if (fromCrisis) afterCrisis(); else { renderGame(); toast(`${fmt(a)} 대출 완료`); } } });
  if (!fromCrisis && S.debt > 0 && S.cash > 1) {
    const all = Math.min(S.debt, S.cash), half = Math.min(S.debt, S.cash * 0.5);
    const pay = a => () => { S.cash -= a; S.debt = Math.max(0, S.debt - a); if (S.debt < 0.05) S.debt = 0; addLog(`${fmt(a)} 상환`); save(); renderGame(); };
    if (half < all - 0.5) opts.push({ label: `🧾 ${fmt(half)} 상환`, sub: '여유 자금의 절반', onClick: pay(half) });
    opts.push({ label: `🧾 ${fmt(all)} 상환${all >= S.debt ? ' (전액)' : ''}`, sub: '', onClick: pay(all) });
  }
  opts.push({ label: fromCrisis ? '◀ 뒤로' : '닫기', dark: true, onClick: () => fromCrisis && cashCrisis() });
  modal({ icon: '🏦', tag: '금융 (턴 소모 없음)', title: '대출 · 상환',
    body: `현재 부채 <b>${fmt(S.debt)}</b> · 분기 이자율 <b>${(rate(S) * 100).toFixed(1)}%</b>\n대출 한도 잔여 <b>${fmt(room)}</b>\n(한도는 생산능력·시장 반응에 따라 늘고, 빚이 많을수록 이자율이 오릅니다)`, options: opts });
}
// 자본금 바닥 → 긴급 자금
function cashCrisis() {
  const need = -S.cash;
  const room = Math.max(0, loanLimit(S) - S.debt);
  const canPersonal = (S.flags.personalTurn ?? -99) + 12 <= S.turn;
  if (room < need && !canPersonal) {
    return modal({ icon: '💸', tag: '자금 위기', title: '더 이상 버틸 수 없다', body: `자금이 ${fmt(S.cash)}. 은행은 대출 한도가 찼다며 고개를 저었고, 회장님의 개인 재산도 이미 바닥났다.`,
      options: [{ label: '결과 보기', primary: true, onClick: () => ending('bankrupt') }] });
  }
  modal({ icon: '🚨', tag: '자금 위기', title: '통장이 바닥났다!', body: `자금이 <b>${fmt(S.cash)}</b>. 협력업체 대금과 월급날이 다가온다.\n이대로면 부도다. 어떻게든 메워야 한다.`,
    options: [
      { label: '🏦 은행 대출로 메우기', sub: room >= need ? `한도 잔여 ${fmt(room)} · 이자 부담 증가` : '한도 부족', disabled: room < need, onClick: () => bank(true) },
      { label: '🏠 회장님 사재 출연', sub: canPersonal ? `개인 재산 ${fmt(need + 5)} 투입 · 체력 -15 · 지분 +3 (3년에 1번)` : '최근에 이미 사용함', disabled: !canPersonal, onClick: () => {
        S.cash += need + 5; S.health -= 15; S.own += 3; S.holder += 5; S.morale += 5; S.flags.personalTurn = S.turn; normalize(S);
        addLog('회장님이 집을 담보로 사재를 털었다');
        modal({ icon: '🏠', title: '사재 출연', body: '회장님이 살던 집을 담보로 잡혀 회사 통장을 채웠다.\n소식을 들은 직원들과 주주들이 "회장님이 진심이구나"라며 술렁였다.', options: [{ label: '다음 분기로 ▶', primary: true, onClick: advance }] }); } },
      { label: '🏳️ 파산 신청', sub: '게임 종료', onClick: () => ending('bankrupt') }] });
}
function afterCrisis() { if (S.cash < 0) cashCrisis(); else { toast('급한 불은 껐다'); advance(); } }

/* ---------- 인사 관리 (분기당 1명, 턴 소모 없음) ---------- */
function personnel(id) {
  const n = S.npcs.find(x => x.id === id); if (!n) return;
  const t = npcT(n), used = S.pAct;
  const act = fn => () => {
    const b = snap(), l0 = n.loyal;
    const txt = fn(); S.pAct = true; normalize(S); save(); addLog(`[인사] ${txt.split('\n')[0]}`);
    const cur = S.npcs.find(x => x.id === id);
    modal({ icon: npcFace(cur, 64), tag: '인사 관리', title: cur.name, body: txt,
      extra: diffHtml(b) + (cur === n ? `<div class="sec">🤝 ${n.name} 충성도 ${Math.round(l0)} → ${Math.round(n.loyal)}</div>` : ''), options: [{ label: '확인', primary: true, onClick: renderGame }] });
  };
  const c1 = (0.3 + S.cap * 0.01) * disc(S), c2 = (1 + S.cap * 0.04) * disc(S), c3 = (2 + S.cap * 0.05) * disc(S);
  const opts = t.type === 'holder' ? [
    { label: '📊 단독 IR 미팅', sub: `비용 ${fmt(c1)} · 충성도 상승 (협상력·사회성)`, disabled: used || S.cash < c1, onClick: act(() => { S.cash -= c1; n.loyal += 12 * abm(S, ['nego', 'social']); S.holder += 3; S.ab.nego += 1;
      return `${n.name}에게 회사의 5개년 비전을 직접 설명했다.\n${S.ab.nego >= 60 ? '회장님의 노련한 화법에 ' + n.name + '의 표정이 점점 풀렸다.' : '질문 공세에 진땀을 뺐지만 진정성은 전달됐다.'}`; }) },
    { label: '🛡️ 우호 지분 확보 (견제)', sub: `비용 ${fmt(c3 * 2)} · 회장 지분 +3, 4분기간 이 주주의 견제 차단`, disabled: used || S.cash < c3 * 2, onClick: act(() => { S.cash -= c3 * 2; S.own += 3; n.checked = 4; n.loyal -= 5; S.ab.insight += 1;
      return `백기사를 섭외해 우호 지분을 늘렸다.\n${n.name}가 "견제구를 던지시는군요"라며 쓴웃음을 지었다. 당분간은 조용할 것이다.`; }) }]
    : [
    { label: '🍶 술 한잔 하며 면담', sub: `비용 ${fmt(c1)} · 충성도 상승 (사회성·유머) · 체력 -3`, disabled: used || S.cash < c1, onClick: act(() => { S.cash -= c1; n.loyal += 12 * abm(S, ['social', 'humor']); S.health -= 3; S.ab.social += 1; S.ab.humor += 0.5;
      return `퇴근 후 ${n.name}와 포장마차에 마주 앉았다.\n${S.ab.humor >= 55 ? '회장님의 농담에 ' + n.name + '가 소주를 뿜었다. 분위기가 순식간에 풀렸다.' : '처음엔 어색했지만, 세 병째쯤 ' + n.name + '가 속마음을 털어놓기 시작했다.'}\n"회장님, 사실 저 요즘…" 그날 밤, 둘 사이의 벽이 조금 낮아졌다.`; }) },
    { label: '🎁 승진·보상', sub: `비용 ${fmt(c2)} · 충성도 대폭 상승`, disabled: used || S.cash < c2, onClick: act(() => { S.cash -= c2; n.loyal += 25; S.morale += 2; S.ab.lead += 1;
      return `${n.name}에게 특별 보상과 함께 더 큰 권한을 줬다.\n"회장님, 이 은혜 잊지 않겠습니다." ${n.name}의 눈빛이 달라졌다.`; }) },
    { label: '⚠️ 견제 (경고·권한 축소)', sub: '충성도 -8 · 6분기간 이 사람의 견제 차단, 불만 반응 절반 · 리더십 +2', disabled: used, onClick: act(() => { n.loyal -= 8; n.checked = 6; S.ab.lead += 2; S.morale -= 2;
      return `${n.name}를 회장실로 불러 선을 그었다. "이 회사의 방향은 내가 정하네."\n${n.name}의 결재 권한 일부를 회수했다. 당분간 딴마음은 못 먹을 것이다. 다만 회사 분위기는 조금 무거워졌다.`; }) },
    { label: '🔁 교체', sub: `비용 ${fmt(c3)} · 새 인물로 교체 · 다른 사람들 충성도 -4, 직원 -5`, disabled: used || S.cash < c3, onClick: act(() => { S.cash -= c3; const i = S.npcs.indexOf(n); const nn = makeNpc(n.id, true); S.npcs[i] = nn; for (const o of S.npcs) if (o !== nn) o.loyal -= 4; S.morale -= 5; S.ab.lead += 1;
      return `${n.name}에게 자리를 비워달라고 했다. 짐을 싸는 뒷모습이 쓸쓸했다.\n새 ${t.role}로 ${nn.name}가 부임했다. 다른 사람들은 "다음은 나일 수도…"라며 몸을 사렸다.`; }) }];
  opts.push({ label: '닫기', dark: true });
  modal({ icon: npcFace(n, 80), tag: t.role, title: `${n.name} · 충성 ${Math.round(n.loyal)} ${moodFace(n.loyal)}`,
    body: `성향: <b>${t.trait}</b>\n👍 좋아하는 경영: ${t.likes.join(', ')}\n👎 싫어하는 경영: ${t.dislikes.join(', ')}${n.loyal < 35 ? '\n\n⚠️ 불만이 많다. 곧 견제가 들어올 수 있다.' : n.loyal >= 85 ? '\n\n🌟 회장님의 든든한 지원군이다.' : ''}${used ? '\n\n이번 분기 인사 관리를 이미 했습니다.' : ''}`,
    options: opts });
}

/* =========================================================
   연말 결산
   ========================================================= */
function tier(rev) {
  if (rev >= 30000) return ['글로벌 초일류', '🌍'];
  if (rev >= 10000) return ['대기업', '🏙️'];
  if (rev >= 3000) return ['중견기업', '🏢'];
  if (rev >= 800) return ['강소기업', '🏬'];
  if (rev >= 200) return ['중소기업', '🏠'];
  return ['동네 공장', '🛖'];
}
function chartHtml(hist) {
  if (!hist.length) return '';
  const max = Math.max(...hist.map(h => h.rev), 1);
  return `<div class="chart">${hist.map((h, i) => `<div class="cb ${i === hist.length - 1 ? 'last' : ''}" title="${h.year}: ${fmt(h.rev)}" style="height:${Math.max(2, h.rev / max * 100)}%"></div>`).join('')}</div>
    <div class="chart-x"><span>${hist[0].year}</span><span>연 매출 추이</span><span>${hist.at(-1).year}</span></div>`;
}
function chairmanSays(h, prev) {
  const g = prev && prev.rev > 0 ? (h.rev / prev.rev - 1) * 100 : 0;
  if (h.op < 0) return '"적자라니… 전생에도 이런 해가 있었지. 버티면 기회가 온다."';
  if (g > 60) return '"허허, 이 맛에 회귀하는 거지! 전생보다 훨씬 빠르구먼."';
  if (g > 20) return '"좋아, 순조롭다. 하지만 방심은 금물이야."';
  if (g > 0) return '"성장은 했지만 이 정도로는 부족해. 더 과감해져야 한다."';
  return '"매출이 뒷걸음질 쳤군. 시장의 흐름을 다시 읽어야겠어."';
}
// 실제 파트론 연혁 (공개 자료 기준) — 연말 결산에서 내 회사와 비교
const REAL = {
  2003: { t: '1월 삼성전기에서 분사해 창업, 3월 중국 생산법인 설립' },
  2006: { t: '12월 13일 코스닥 상장 (공모가 8,300원)' },
  2008: { t: '5월 베트남 생산법인 PARTRON VINA 설립' },
  2018: { t: '매출 1조 원 돌파 — 중견기업 반열에', rev: 10000 },
  2019: { t: '매출 1조 2,546억 원, 영업이익 1,052억 원', rev: 12546, op: 1052 },
};
function realHtml(year, h) {
  const r = REAL[year]; if (!r) return '';
  if (year === 2018 && h.rev >= 10000) ach('📜', '2018년 매출 1조 — 역사와 나란히');
  let cmp = '';
  if (r.rev) {
    const ratio = h.rev / r.rev;
    cmp = `<br>내 매출 ${fmt(h.rev)} vs 실제 ${r.rev >= 10000 && !r.op ? '1조 이상' : fmt(r.rev)} → ${ratio >= 1 ? `<b>역사를 ${ratio >= 1.5 ? '아득히 ' : ''}넘어섰다! 🎉</b>` : `아직 역사의 ${Math.round(ratio * 100)}% 수준`}`;
  }
  return `<div class="quote">📜<div><div class="qn">실제 파트론의 ${year}년</div>${r.t}${cmp}</div></div>`;
}
function annualReport(year) {
  const h = S.hist.at(-1), prev = S.hist.at(-2);
  const [tn, ti] = tier(h.rev);
  const growth = prev && prev.rev > 0 ? `${h.rev >= prev.rev ? '▲' : '▼'} ${Math.abs(Math.round((h.rev / prev.rev - 1) * 100))}%` : '첫 해';
  renderGame();
  modal({ icon: ceoFace(72), tag: `${year}년 연말 결산`, title: `${ti} ${tn}`,
    extra: `<div class="report">
        <div class="money"><div class="k">연 매출</div><div class="v">${fmt(h.rev)}</div></div>
        <div class="money"><div class="k">연 영업이익</div><div class="v ${h.op >= 0 ? 'pos' : 'neg'}">${fmt(h.op)}</div></div>
        <div class="money"><div class="k">전년 대비</div><div class="v">${growth}</div></div>
        <div class="money"><div class="k">현재 총점</div><div class="v">${fmt(scoreOf(S).total)}</div></div>
      </div>${chartHtml(S.hist)}${realHtml(year, h)}<div class="quote">👴 ${chairmanSays(h, prev)}</div>
      ${S.age >= MAX_AGE - 5 ? `<div class="quote bad">⏳ 회장님 나이 ${Math.floor(S.age)}세. ${MAX_AGE}세가 되면 자동으로 은퇴합니다.</div>` : ''}`,
    options: [{ label: `${year + 1}년 시작 ▶`, primary: true, onClick: startTurn }] });
}

/* =========================================================
   점수 · 은퇴 · 엔딩 · 랭킹
   총점 = 자본금(자금-부채) + 최근 1년 매출 + 최근 1년 영업이익
   ========================================================= */
function scoreOf(s) {
  const q4 = s.qhist.slice(-4);
  const capital = s.cash - s.debt;
  const revenue = q4.reduce((a, h) => a + h.rev, 0);
  const profit = q4.reduce((a, h) => a + h.op, 0);
  return { capital, revenue, profit, total: capital + revenue + profit };
}
function checkGameOver() {
  if (S.flags.lostMA) { ending('ma'); return true; }
  if (S.health <= 0) { hospital(); return true; }
  if (S.age >= MAX_AGE) { modal({ icon: '🎂', title: `${MAX_AGE}세 생일`, body: `어느덧 ${MAX_AGE}번째 생일. 전생에 눈을 감았던 77세를 지나, 덤으로 3년을 더 달렸다.\n"이제… 물려줄 때가 됐구나."`, options: [{ label: '후계자 정하기', primary: true, onClick: () => retireFlow(true, 'age') }] }); return true; }
  return false;
}
/* ---------- 업적 ---------- */
function ach(i, t) {
  S.ach = S.ach || [];
  if (S.ach.some(a => a.t === t)) return;
  S.ach.push({ i, t, y: S.year });

    <div class="grade">${gi} ${gt}</div>
    <div class="m-body" style="margin:0">${ed}\n${gd}</div>
    ${succTxt ? `<div class="m-body" style="font-size:13px;margin:0">${succTxt}</div>` : ''}
    <div class="panel" style="width:100%;text-align:left">
      <div class="center muted" style="font-size:12px">최종 총점 (자본금 + 최근 1년 매출 + 최근 1년 영업이익${mult !== 1 ? ` × ${mult}` : ''})</div>
      <div class="center score-big">${fmt(total)}</div>
      <div class="money-row" style="margin-top:8px">
        <div class="money"><div class="k">자본금</div><div class="v ${sc.capital < 0 ? 'neg' : ''}">${fmt(sc.capital)}</div></div>
        <div class="money"><div class="k">1년 매출</div><div class="v">${fmt(sc.revenue)}</div></div>
        <div class="money"><div class="k">1년 영업이익</div><div class="v ${sc.profit < 0 ? 'neg' : ''}">${fmt(sc.profit)}</div></div>
      </div>${chartHtml(S.hist)}
      <div class="sub-row"><span>경영 <b>${S.hist.length}년</b></span><span>은퇴 <b>${Math.floor(S.age)}세</b></span><span>회장 지분 <b>${Math.round(S.own)}%</b></span></div>
      <div id="rankMsg" class="center" style="margin-top:12px;font-weight:700;color:var(--gold)">🏆 랭킹 등록 중…</div>
    </div>
    <div class="menu"><button class="btn btn-gold" id="bAch">🏅 내 업적 보기</button><button class="btn btn-dark" id="bRank">🏆 명예의 전당 보기</button><button class="btn btn-dark" id="bAgain">다시 회귀하기 🔄</button></div></div>`;
  $('#bAch').onclick = () => recordModal({ ...rec, created_at: '방금' });
  $('#bAgain').onclick = () => { clearSave(); renderTitle(); };
  $('#bRank').onclick = () => { clearSave(); renderRanking(rec); };
  submitScore(rec);
}
function localRanks() { try { return JSON.parse(localStorage.getItem(LOCAL_RANK_KEY)) || []; } catch (e) { return []; } }
async function submitScore(rec) {
  try { const l = localRanks(); l.push({ ...rec, created_at: new Date().toISOString().slice(0, 19).replace('T', ' ') }); l.sort((a, b) => b.score - a.score); localStorage.setItem(LOCAL_RANK_KEY, JSON.stringify(l.slice(0, 50))); } catch (e) {}
  const msg = t => { const el = $('#rankMsg'); if (el) el.innerHTML = t; };
  const slow = setTimeout(() => msg('🏆 랭킹 서버 깨우는 중… (최대 1분)'), 4000);
  try {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 70000);
    const r = await fetch(SERVER + '/api/younggam/submit', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ ...rec, key: RANK_API_KEY }), signal: ctl.signal });
    clearTimeout(to); const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    msg(`🏆 전체 랭킹 <b>${j.rank}위</b> 등록 완료!`);
  } catch (e) { msg('⚠️ 랭킹 서버 연결 실패 — 이 PC 기록에만 저장했어요.'); }
  clearTimeout(slow);
}
async function renderRanking(mine) {
  app.className = ''; app.innerHTML = `<div style="padding-top:10px"><div class="step-title">🏆 명예의 전당</div>
    <div class="muted center" style="font-size:12px;margin:-8px 0 10px">총점 = 자본금 + 최근 1년 매출 + 최근 1년 영업이익</div>
    <div class="tabs"><button class="tab on" id="tAll">전체 랭킹</button><button class="tab" id="tLocal">이 PC 기록</button></div>
    <div class="panel" id="rk"><div class="center muted" style="padding:30px 0">불러오는 중… (서버가 잠들어 있으면 최대 1분)</div></div>
    <button class="btn btn-dark" id="bBack">🏠 타이틀로</button></div>`;
  $('#bBack').onclick = renderTitle;
  const draw = rows => {
    if (!rows.length) { $('#rk').innerHTML = '<div class="center muted" style="padding:30px 0">아직 기록이 없습니다. 첫 번째 전설이 되어보세요!</div>'; return; }
    $('#rk').innerHTML = rows.map((r, i) => {
      let f = null; try { f = JSON.parse(r.face); } catch (e) {}
      const me = mine && r.player === mine.player && Math.abs(r.score - mine.score) < 0.2;
      return `<div class="rank-row ${me ? 'me' : ''}" data-i="${i}" title="눌러서 업적 보기"><div class="no">${i + 1}</div>${f && f.s !== undefined ? faceSVG(f, r.age || 60, 40, { bg: '#5a4520' }) : '<div style="width:40px;font-size:28px">👴</div>'}
        <div class="info"><div class="n1">${esc(r.player)} <span class="muted" style="font-weight:400;font-size:12px">${esc(r.company || '')} ${BIZ[r.biz] ? BIZ[r.biz].icon : ''}</span></div>
        <div class="n2">${esc(r.ending || '')} · ${r.age || '?'}세 · 매출 ${fmt(r.revenue || 0)}</div></div><div class="sc">${fmt(r.score)}<div class="muted" style="font-size:10px;font-weight:400">업적 보기 ›</div></div></div>`;
    }).join('');
    $('#rk').querySelectorAll('.rank-row').forEach(el => el.onclick = () => recordModal(rows[el.dataset.i]));
  };
  const showLocal = () => { $('#tLocal').classList.add('on'); $('#tAll').classList.remove('on'); draw(localRanks()); };
  const showAll = async () => {
    $('#tAll').classList.add('on'); $('#tLocal').classList.remove('on');
    $('#rk').innerHTML = '<div class="center muted" style="padding:30px 0">불러오는 중… (서버가 잠들어 있으면 최대 1분)</div>';
    try {
      const ctl = new AbortController(); setTimeout(() => ctl.abort(), 70000);
      const r = await fetch(`${SERVER}/api/younggam/top?key=${RANK_API_KEY}&limit=50`, { signal: ctl.signal });
      const j = await r.json(); if (!r.ok) throw 0;
      if ($('#tAll')?.classList.contains('on')) draw(j.rows);
    } catch (e) { if ($('#tAll')?.classList.contains('on')) $('#rk').innerHTML = '<div class="center muted" style="padding:20px 0">⚠️ 랭킹 서버에 연결할 수 없어요.<br>「이 PC 기록」 탭에서 내 기록을 볼 수 있습니다.</div>'; }
  };
  $('#tAll').onclick = showAll; $('#tLocal').onclick = showLocal;
  showAll();
}

renderTitle();
</script>
</body>
</html>
